<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>fido2-js</title>
	</head>

	<body>
		<!-- Test by starting an http server in root folder, aka Live Server VS Code extension -->

		<button style="font-size: xx-large">Attest</button>
		<button style="font-size: xx-large">Assert</button>

		<script type="importmap">
			{
				"imports": {
					"cbor-x/decode-no-eval": "/node_modules/cbor-x/decode.js"
				}
			}
		</script>
		<script type="module">
			import { attestation, assertion } from "/esm/index.js";

			let key;

			async function attest() {
				const challenge = new Uint8Array(32);
				crypto.getRandomValues(challenge);
				console.log("challenge", challenge);

				/** @type {PublicKeyCredential} */
				const credential = await navigator.credentials.create({
					publicKey: {
						challenge,
						rp: {
							name: "Example",
							id: location.hostname,
						},
						user: {
							id: new Uint8Array([1, 2, 3, 4]),
							name: "test@example.com",
							displayName: "Test User",
						},
						pubKeyCredParams: [
							{ type: "public-key", alg: -7 }, // ES256
							{ type: "public-key", alg: -8 }, // Ed25519
							{ type: "public-key", alg: -257 }, // RS256
						],
						timeout: 60000,
					},
				});

				const response = await attestation(credential.response, { challenge });
				console.log(response);
				key = response.jwk();
			}

			async function assert() {
				const challenge = new Uint8Array(32);
				crypto.getRandomValues(challenge);
				console.log("challenge", challenge);

				/** @type {PublicKeyCredential} */
				const credential = await navigator.credentials.get({
					publicKey: {
						challenge,
						rpId: location.hostname,
						allowCredentials: [credential],
						timeout: 60000,
						userVerification: "preferred",
					},
				});

				const response = await assertion(credential.response, { challenge, publicKey: key });
				console.log(response);
			}

			const [b1, b2] = document.querySelectorAll("button");
			b1.onclick = attest;
			b2.onclick = assert;
		</script>
	</body>
</html>
